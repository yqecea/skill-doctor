name: skill-doctor
description: Lint agent skill directories (SKILL.md frontmatter, naming, links) across harness layouts.
branding:
  icon: check-circle
  color: green
inputs:
  path:
    description: Directory to scan. May be given multiple times via a space-separated list.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Lint skills
      shell: bash
      run: node "${{ github.action_path }}/src/cli.mjs" ${{ inputs.path }}
